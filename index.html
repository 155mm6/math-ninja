<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥷 Математический Ниндзя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Падающая сакура */
        .sakura {
            position: fixed;
            width: 15px;
            height: 15px;
            background: #FFB7C5;
            border-radius: 50%;
            opacity: 0.6;
            animation: fall linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        .game-title {
            font-size: clamp(3em, 10vw, 6em);
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: clamp(1.2em, 4vw, 2em);
            color: white;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .menu-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            border: 5px solid #FFD700;
        }

        .game-mode {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 25px 40px;
            font-size: clamp(1.3em, 4vw, 1.8em);
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            width: 100%;
            margin-bottom: 20px;
            text-decoration: none;
            display: block;
        }

        .game-mode:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 14px 30px rgba(255, 107, 107, 0.6);
        }

        .game-mode.multiplayer {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .game-mode.multiplayer:hover {
            box-shadow: 0 14px 30px rgba(76, 175, 80, 0.6);
        }

        .game-description {
            color: #ccc;
            font-size: clamp(0.9em, 2.5vw, 1.1em);
            margin-top: 10px;
            font-weight: normal;
        }

        .info-box {
            background: rgba(33, 150, 243, 0.2);
            border: 2px solid #2196F3;
            border-radius: 15px;
            padding: 15px;
            margin-top: 30px;
            color: white;
            font-size: clamp(0.9em, 2.5vw, 1em);
            text-align: left;
        }

        .info-box strong {
            color: #FFD700;
        }

        @media (max-width: 768px) {
            .menu-container {
                padding: 30px 20px;
            }

            .game-mode {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-title">🥷<br>МАТЕМАТИЧЕСКИЙ<br>НИНДЗЯ</div>
        <div class="subtitle">Выбери режим игры</div>

        <div class="menu-container">
            <a href="math-ninja-mvp.html" class="game-mode">
                🎮 ОДИНОЧНАЯ ИГРА
                <div class="game-description">
                    Тренировка • Пояса • Свои примеры
                </div>
            </a>

            <a href="math-ninja-online.html" class="game-mode multiplayer">
                🌐 ОНЛАЙН МУЛЬТИПЛЕЕР
                <div class="game-description">
                    Играй с друзьями • Создай комнату • Соревнуйся
                </div>
            </a>

            <div class="info-box">
                💡 <strong>Одиночная игра</strong> - работает сразу, не требует настройки<br>
                🔧 <strong>Мультиплеер</strong> - требует настройку Firebase (5 минут)
            </div>
        </div>
    </div>

    <script>
        // Создание падающей сакуры
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const sakura = document.createElement('div');
                sakura.className = 'sakura';
                sakura.style.left = Math.random() * 100 + '%';
                sakura.style.animationDuration = (Math.random() * 3 + 5) + 's';
                sakura.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(sakura);
            }, i * 200);
        }
    </script>
</body>
</html>
